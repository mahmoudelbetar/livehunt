[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livehunt"
version = "0.7.1"
description = "Passive live-capture toolkit for web bug hunters: watch your own browser, build an object graph, get ranked hypotheses."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "livehunt contributors" }]
keywords = ["bug-bounty", "security", "cdp", "chrome-devtools", "idor", "burp-alternative"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = ["requests>=2.28", "websocket-client>=1.6"]

[project.scripts]
livehunt = "livehunt.cli:main"
livekit = "livehunt.cli:main"

[project.urls]
Homepage = "https://github.com/mahmoudelbetar/livehunt"
Issues = "https://github.com/mahmoudelbetar/livehunt/issues"

[tool.setuptools]
packages = ["livehunt"]

[tool.setuptools.package-data]
livehunt = ["templates/*.json"]
